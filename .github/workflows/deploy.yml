name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          name: multiverse-portfolio
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Optional: Add version badge generation
  version:
    runs-on: ubuntu-latest
    needs: deploy
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Generate version badge
        uses: emibcn/badge-action@v2.0.2
        with:
          label: 'Version'
          status: '1.0.0'
          color: 'brightgreen'
          filename: version-badge.svg
      
      - name: Upload badge
        uses: actions/upload-artifact@v4
        with:
          name: version-badge
          path: version-badge.svg
